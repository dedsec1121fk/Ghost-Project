name: Publish Greek Map package from MBTiles

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Package tier
        required: true
        type: choice
        options: [lite, standard, enhanced, detailed, full]
      target_gb:
        description: Display/download budget in GB
        required: true
        default: '15'
      source_url:
        description: Direct URL to a prepared OpenMapTiles-compatible Greece MBTiles file
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RELEASE_TAG: greek-map-packs
      BUILD_DIR: ${{ github.workspace }}/.greek-map-publish
    steps:
      - uses: actions/checkout@v4

      - name: Download package with resume/retry
        run: |
          mkdir -p "$BUILD_DIR/chunks"
          curl --fail --location --retry 8 --retry-delay 5 --continue-at - \
            --output "$BUILD_DIR/greece.mbtiles" \
            '${{ inputs.source_url }}'

      - name: Validate package
        run: |
          python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path
          p=Path(os.environ['BUILD_DIR'])/'greece.mbtiles'
          db=sqlite3.connect(p)
          db.execute('SELECT 1 FROM metadata LIMIT 1').fetchone()
          db.execute('SELECT 1 FROM tiles LIMIT 1').fetchone()
          db.close()
          print(p.stat().st_size)
          PY

      - name: Split package into safe chunks
        run: |
          python3 tools/chunk_greek_map_package.py \
            --input "$BUILD_DIR/greece.mbtiles" \
            --output-dir "$BUILD_DIR/chunks" \
            --tier '${{ inputs.tier }}' \
            --target-gb '${{ inputs.target_gb }}' \
            --chunk-mib 128 \
            --release-tag "$RELEASE_TAG"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Greek Map offline packages" --notes "Resumable chunked offline packages for Greek Map."

      - name: Remove old assets for this tier
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$BUILD_DIR/release.json"
          python3 - <<'PY' > "$BUILD_DIR/delete-assets.txt"
          import json, os
          from pathlib import Path
          tier=os.environ['TIER']
          data=json.loads((Path(os.environ['BUILD_DIR'])/'release.json').read_text())
          for a in data.get('assets',[]):
              n=a.get('name','')
              if n.startswith(f'greek-map-{tier}.part') or n==f'greek-map-{tier}-manifest.json':
                  print(a['id'])
          PY
          while read -r id; do
            [ -z "$id" ] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
          done < "$BUILD_DIR/delete-assets.txt"

      - name: Upload package chunks
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier }}
        run: |
          for f in "$BUILD_DIR"/chunks/greek-map-${TIER}.part* "$BUILD_DIR"/chunks/greek-map-${TIER}-manifest.json; do
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done
